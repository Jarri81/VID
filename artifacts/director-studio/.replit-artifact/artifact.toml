kind = "web"
previewPath = "/"
title = "Director Studio"
description = "A long-form AI filmmaking workspace for planning films scene by scene or directing through conversation, coordinating video, voice, music, sound effects, continuity, and final assembly across multiple generation providers."
version = "1.0.0"
id = "artifacts/director-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24751

[services.development]
run = "pnpm --filter @workspace/director-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/director-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/director-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24751"
BASE_PATH = "/"
